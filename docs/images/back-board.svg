<text class="dimt" x="316" y="260" text-anchor="start">148</text>
<path class="dim" d="M312,400 V331" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text class="dimt" x="316" y="368.5" text-anchor="start">69</text>
<path class="dim" d="M0,-10 H300" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text class="dimt" x="150" y="-13" text-anchor="middle">300</text>
<path class="dim" d="M-14,400 V0" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text class="dimt" x="-18" y="203" text-anchor="end">400</text>
<text class="cap" x="150" y="432" text-anchor="middle">BACK BOARD · MM · DASHED: CASE</text>
