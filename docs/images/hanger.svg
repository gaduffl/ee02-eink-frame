<title id="hgT">Wall hanger, wall side</title>
<desc id="hgD">Keyhole slot with seven notches 4 mm apart. Push the screw head through the round hole, slide sideways, and let it drop into a notch. The V mark on the top edge is the centre notch.</desc>
