<title id="dsT">Depth stack next to the case</title>
<desc id="dsD">Section through the frame edge beside the case. Frame profile 30 mm deep with a 5.7 mm lip. Behind it: glass 2 mm (assumed), passepartout 1.4 mm, foam tape 1 mm, case 14.2 mm. About 20.9 mm is available behind the passepartout.</desc>
