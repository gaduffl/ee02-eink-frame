# Amazon Associates tracking IDs, one per store. Leave empty for plain links without a tag.
# Each store is a separate Associates programme with its own ID, and the repository URL
# has to be listed as a website in each account.
# After editing:  python3 parts/render.py

com = ""   # amazon.com, e.g. "yourid-20"
de = "amazonpar049d-21"    # amazon.de,  e.g. "yourid-21"
fr = ""    # amazon.fr,  e.g. "yourid-21"

# Seeed Studio affiliate links (own programme, https://www.seeedstudio.com/blog/affiliate-program/).
# `code` is the affiliate code from the Seeed dashboard; `template` builds the link from it.
# A full tracking link under the part's id (e.g. kit = "https://...") overrides the template.
[seeed]
code = "51k9ycE"
template = "{url}?sensecap_affiliate={code}&referring_service=link"
kit = ""
