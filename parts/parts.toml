# Parts list for the README. Edit here, then run:  python3 parts/render.py
#
# A part sold only by Seeed has a [part.seeed] table (url, label); it is shown in every column.
# Per Amazon store, a part has one of:
#   asin = "B0..."      product link   https://www.amazon.<tld>/dp/<asin>
#   search = "..."      search link    https://www.amazon.<tld>/s?k=<search>
# plus an optional label (link text).
# verified = true means the listing was checked against `needs` on the product page,
# on the date in `checked`. Unverified product links are marked in the README.

checked = ""

