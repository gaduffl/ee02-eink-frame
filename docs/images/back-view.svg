<title id="bvT">Back view of the frame with the case in place</title>
<desc id="bvD">Frame lying face down. The display flex folds around the panel's lower edge. The L-shaped case sits over the panel's lower right corner and is taped to the passepartout's right margin; the battery sits above the EE02 board and its lid slides out towards the frame centre. Hangers on the top edge and left edge, bumpers in the corners.</desc>
